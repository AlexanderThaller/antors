# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# No `rust-toolchain` entry, unlike trivy-web: there is no rust-toolchain.toml
# here. The compiler comes from rust-overlay pinned by flake.lock, which
# dependabot does not read — `nix flake update` is what moves it.
version: 2
updates:
  # The crates in Cargo.toml, `adocers-html` and `adocers-render-core` among
  # them.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  # The actions in .github/workflows are pinned to commit shas so that a moved
  # tag cannot change what runs. That is only safe if something raises the pins
  # when they go stale, which is this.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
