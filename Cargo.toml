[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlexanderThaller/antors"
rust-version = "1.96"

[workspace.dependencies]
# Both of these are taken with their defaults off by the only crate that
# depends on them, which re-enables what it wants through features of its own —
# so the workspace entry says so, rather than a member trying to override it
# and cargo refusing.
antors-asciidoc = { version = "0.1", path = "crates/antors-asciidoc", default-features = false }
antors-content = { version = "0.1", path = "crates/antors-content" }
antors-model = { version = "0.1", path = "crates/antors-model" }
antors-site = { version = "0.1", path = "crates/antors-site", default-features = false }
antors-ui = { version = "0.1", path = "crates/antors-ui" }
adocers-html = { version = "0.3", default-features = false }
adocers-render-core = { version = "0.3", default-features = false }
# The PDF back end, behind the `pdf` feature. Taken with its defaults off for
# the same reason as the two above: the crate that depends on it re-enables
# `math` and `mermaid` from features of its own, so the two back ends cannot be
# asked for different things.
adocers-typst = { version = "0.3", default-features = false }
anyhow = "1"
# Only what reading a repository needs: refs, trees and blobs. No network, no
# worktree checkout, no index — a build reads history, it does not change it.
gix = { version = "0.87", default-features = false, features = [
  "revision",
  "max-performance-safe",
  "sha1",
] }
asciidoc-parser = "0.31"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
thiserror = "2"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
pedantic = { level = "warn", priority = -1 }
todo = "warn"
unwrap_used = "warn"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[package]
name = "antors"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Build and serve an Antora documentation site, in Rust"
keywords = ["antora", "asciidoc", "documentation", "static-site"]
categories = ["command-line-utilities", "text-processing"]

# Build the documentation with everything switched on, so that items behind a
# feature are in it rather than missing without explanation. Rustdoc labels
# each with the feature it needs on its own since 1.92, so nothing here has to
# ask for that.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["serve", "highlight", "math", "mermaid", "pdf", "search"]

# `antors serve`: a local server that rebuilds and reloads as the sources
# change. Without it the binary only builds.
serve = ["dep:axum", "dep:tokio", "dep:notify-debouncer-full", "dep:serde"]

highlight = ["antors-site/highlight"]
math = ["antors-site/math"]
mermaid = ["antors-site/mermaid"]

# `antors build --pdf`: every page, and every component version, also written
# as a PDF.
pdf = ["antors-site/pdf"]

# The site's search: a pagefind index written beside the pages, and the box in
# the navbar that reads it. Without it `--no-search` is the only behaviour, and
# a playbook that asks for search is told so.
search = ["antors-site/search"]

[dependencies]
antors-site.workspace = true
antors-model.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
serde = { workspace = true, optional = true }
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
  "query",
], optional = true }
# `override` routes the C in the build through mimalloc as well — the
# tree-sitter grammars, which allocate for every node they parse. Without it
# only Rust's own allocations go through it.
mimalloc = { version = "0.1", features = ["override"] }
notify-debouncer-full = { version = "0.7", optional = true }
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "net",
  "signal",
  "sync",
  "time",
  "fs",
  "macros",
], optional = true }

[lints]
workspace = true

[profile.deploy]
inherits = "release"
strip = true
lto = true
codegen-units = 1

# What the test suites are built with in `nix flake check`: optimized, since the
# showcase they build is slow unoptimized, but without `deploy`'s LTO and
# single codegen unit, which only pay off in a binary that is kept — and with
# the assertions a plain `cargo test` has.
[profile.ci]
inherits = "release"
debug-assertions = true
overflow-checks = true
