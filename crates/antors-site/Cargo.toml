[package]
name = "antors-site"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Build an Antora documentation site from a playbook"
keywords = ["antora", "asciidoc", "documentation", "static-site"]
categories = ["text-processing"]

[dependencies]
antors-asciidoc.workspace = true
antors-content.workspace = true
antors-model.workspace = true
antors-ui.workspace = true
thiserror.workspace = true

# Build the documentation with everything switched on, so that items behind a
# feature are in it rather than missing without explanation. Rustdoc labels
# each with the feature it needs on its own since 1.92, so nothing here has to
# ask for that.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["highlight", "math", "mermaid"]
highlight = ["antors-asciidoc/highlight"]
math = ["antors-asciidoc/math"]
mermaid = ["antors-asciidoc/mermaid"]

[lints]
workspace = true
