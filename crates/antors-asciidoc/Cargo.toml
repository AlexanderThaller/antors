[package]
name = "antors-asciidoc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Parse and render an Antora site's pages, resolving resource IDs against its catalog"
keywords = ["antora", "asciidoc", "documentation"]
categories = ["text-processing"]

[dependencies]
adocers-html.workspace = true
adocers-render-core.workspace = true
adocers-typst = { workspace = true, optional = true }
antors-content.workspace = true
antors-model.workspace = true
asciidoc-parser.workspace = true
thiserror.workspace = true

# Build the documentation with everything switched on, so that items behind a
# feature are in it rather than missing without explanation. Rustdoc labels
# each with the feature it needs on its own since 1.92, so nothing here has to
# ask for that.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["highlight", "math", "mermaid", "pdf"]
highlight = ["adocers-html/highlight"]
math = ["adocers-html/math", "adocers-typst?/math"]
mermaid = ["adocers-html/mermaid", "adocers-typst?/mermaid"]

# Typeset a page, and a whole component version, as a PDF. It brings Typst in,
# which is a large dependency to build and to carry — so it is a feature,
# although a default one: a documentation site that cannot be printed is worth
# less than the build time it saves.
pdf = ["dep:adocers-typst"]

[lints]
workspace = true
